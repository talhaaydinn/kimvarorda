# Render Blueprint — Render panelinde: New → Blueprint → bu repoyu seç.
# "sync: false" olan değerleri Render kurulum sırasında senden ister.
services:
  - type: web
    name: kimvarorda
    runtime: node
    plan: free
    region: frankfurt
    # NODE_ENV=production derlemede devDependencies'i (Vite) atlatır; --include=dev şart
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Zincir: ziyaretçi → Cloudflare → Render yük dengeleyici → uygulama = 3 adım.
      # 1 olursa herkes Render'ın iç IP'si (10.x) görünür ve ağ kilidi herkesi birlikte kilitler.
      # Doğrulama: /api/health → "ip" senin gerçek IP'n olmalı (2026-11-16'da ölçüldü).
      - key: TRUST_PROXY
        value: "3"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
